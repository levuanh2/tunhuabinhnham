# Wakes the Render Free backend from non-Cloudflare IPs, around the clock. Render Free sleeps after 15 min without
# requests, so this pings every 10 min WHEN GitHub runs the schedule. GitHub delays or drops scheduled runs
# (2026-11-13 15:26Z to 11-14 14:03Z: 3 of 33 slots ran, 3 min to ~4 h late), so this is best effort, never always-on.
# The Cloudflare cron Worker tunhuabinhnham-render-keepalive (:22/:52, 07:22-01:00 VN) stays as a second source.
# ponytail: public repo, so Actions minutes are free; 144 runs/day of well under 1 min each.
# Render Free: 750 instance-hours per workspace per month. Awake 24/7 = up to 744 h, so ANY other free service in the
# same Render workspace exceeds it, and Render then suspends free services until the month ends. Check before merging.
name: render-keepalive

on:
  schedule:
    # Every 10 min, all day: :07 :17 :27 :37 :47 :57 UTC = the same minutes in Vietnam (UTC+7).
    # Off :00/:30, GitHub's busiest minutes, where scheduled runs are delayed or dropped most.
    - cron: "7,17,27,37,47,57 * * * *"
  workflow_dispatch:

permissions: {}

# One ping at a time: a run queued behind a slow cold-start ping waits instead of hitting Render in parallel.
concurrency:
  group: render-keepalive
  cancel-in-progress: false

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    env:
      TARGET: https://tunhuabinhnham-api.onrender.com/health/live
    steps:
      # One request per run, never retried. If Render sent Retry-After (429/503), later runs skip until it passes.
      - name: Restore Retry-After backoff
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .keepalive-not-before
          key: keepalive-not-before-${{ github.run_id }}
          restore-keys: keepalive-not-before-

      - name: GET /health/live (fails on non-2xx or timeout)
        id: ping
        shell: bash
        run: |
          # GitHub runs bash -eo pipefail; this script checks every status itself (grep finding no header is normal).
          set +e -uo pipefail
          now=$(date -u +%s)
          not_before=$(tr -cd '0-9' 2>/dev/null < .keepalive-not-before || true)
          if [ -n "$not_before" ] && [ "$now" -lt "$not_before" ]; then
            echo "ts=$(date -u +%FT%TZ) event=$GITHUB_EVENT_NAME outcome=skipped reason=retry-after until=$(date -u -d "@$not_before" +%FT%TZ)"
            exit 0
          fi

          started=$(date -u +%FT%TZ)
          # 120 s covers a Render Free cold start (35-46 s observed); the job timeout bounds everything else.
          result=$(curl -sS --max-time 120 -o /dev/null -D headers.txt \
            -A "tunhuabinhnham-render-keepalive-gh" -w '%{http_code} %{time_total}' "$TARGET")
          curl_exit=$?
          status=${result%% *}; duration=${result##* }
          header() { grep -i "^$1:" headers.txt 2>/dev/null | tail -n 1 | cut -d: -f2- | tr -d '\r' | sed 's/^ *//'; }
          rndr_id=$(header rndr-id | tr -cd 'A-Za-z0-9-')
          retry_after=$(header retry-after | tr -cd 'A-Za-z0-9 ,:-')

          if [ -n "$retry_after" ]; then
            if [[ "$retry_after" =~ ^[0-9]+$ ]]; then until=$(( $(date -u +%s) + retry_after ))
            else until=$(date -u -d "$retry_after" +%s 2>/dev/null || true); fi
            if [[ "${until:-}" =~ ^[0-9]+$ ]]; then echo "$until" > .keepalive-not-before; echo "not_before=$until" >> "$GITHUB_OUTPUT"; fi
          fi

          outcome=failure
          if [ "$curl_exit" -eq 0 ] && [ "$status" -ge 200 ] && [ "$status" -lt 300 ]; then outcome=success; fi
          line="ts=$started event=$GITHUB_EVENT_NAME status=$status duration_s=$duration rndr_id=${rndr_id:-none} retry_after=${retry_after:-none} curl_exit=$curl_exit outcome=$outcome"
          echo "$line"
          echo "$line" >> "$GITHUB_STEP_SUMMARY"
          [ "$outcome" = success ]

      - name: Save Retry-After backoff
        if: always() && steps.ping.outputs.not_before != ''
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .keepalive-not-before
          key: keepalive-not-before-${{ github.run_id }}
