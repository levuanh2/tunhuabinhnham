name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      run_supabase_integration:
        description: Run read-only integration checks against configured Supabase
        type: boolean
        default: false

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install "./apps/api[dev]"
      - run: python -m ruff check apps/api
      - run: python -m mypy apps/api/app
      - run: python -m pytest apps/api/tests -m "not integration_supabase"
      - run: python -m alembic -c apps/api/alembic.ini history

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm --workspace apps/web run lint
      - run: npm --workspace apps/web run typecheck
      - run: npm --workspace apps/web test
      - run: npm --workspace apps/web run build
        env:
          NEXT_PUBLIC_API_URL: http://127.0.0.1:8000/api/v1
          NEXT_PUBLIC_SITE_URL: http://localhost:3000
      - name: Build Cloudflare Worker artifact
        run: npm --workspace apps/web run build:cloudflare
        env:
          NEXT_PUBLIC_API_URL: http://127.0.0.1:8000/api/v1
          NEXT_PUBLIC_SITE_URL: http://localhost:3000

  e2e:
    runs-on: ubuntu-latest
    needs: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # desktop = Chromium, mobile = iPhone 13 (WebKit): both projects need their browser.
      - run: npx playwright install --with-deps chromium webkit
      # Local workerd has no Workers Cache purge; worker.ts tolerates that only with this wrangler-dev var.
      # .dev.vars is git-ignored and never uploaded by wrangler deploy.
      # API_TIMEOUT_MS: the hung-request regression test (api-outage.spec.ts) must end in 5 s, not the 60 s default.
      - run: |
          echo E2E_LOCAL_NO_EDGE_CACHE=1 > apps/web/.dev.vars
          echo API_TIMEOUT_MS=5000 >> apps/web/.dev.vars
      - run: npm --workspace apps/web run test:e2e
        env:
          CI: "true"
          # Playwright starts e2e/fixtures/mock-api.mjs on 127.0.0.1:8100 (playwright.config.ts). The Next build and
          # server read these, so the app talks only to the fixture: never Supabase or Render.
          E2E_MOCK_API: "1"
          NEXT_PUBLIC_API_URL: http://127.0.0.1:8100/api/v1
          NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:8100
          NEXT_PUBLIC_SUPABASE_ANON_KEY: qa-local-mock-key
          NEXT_PUBLIC_SITE_URL: http://localhost:8787

  supabase-integration:
    if: github.event_name == 'workflow_dispatch' && inputs.run_supabase_integration
    runs-on: ubuntu-latest
    env:
      APP_ENV: staging
      DATABASE_URL: ${{ secrets.SUPABASE_DATABASE_URL }}
      RUN_SUPABASE_INTEGRATION: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install "./apps/api[dev]"
      - name: Read-only schema and RLS verification
        run: python -m pytest apps/api/tests/test_supabase_integration.py -m integration_supabase
      - name: Report migration drift (read-only)
        run: python -m alembic -c apps/api/alembic.ini check
